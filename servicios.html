<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Armar plan – Eventos PDE</title>
<!-- Traslados y alojamiento ahora se piden desde Armar plan (plan.html). Esta dirección queda para los links viejos:
     lleva a plan.html y, si venía de un evento (?e=<id>), lo suma al plan. -->
<meta name="robots" content="noindex">
<link rel="canonical" href="https://eventospde.com/plan.html">
<script>
  (function () {
    var e = new URLSearchParams(location.search).get("e");
    location.replace("/plan.html" + (e ? "?add=" + encodeURIComponent(e) : ""));
  })();
</script>
<meta http-equiv="refresh" content="0; url=/plan.html">
</head>
<body style="background:#151518;color:#F4F4F5;font-family:system-ui,sans-serif;padding:24px">
<p>Los traslados y el alojamiento ahora se piden desde <a href="/plan.html" style="color:#F4F4F5">Armar plan</a>.</p>
</body>
</html>
